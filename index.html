<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>A Little Something For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   EDIT ME: scroll to the bottom <script> block and update the
   CONFIG object — her name, message, photos, and quotes all
   live there in one place.

:root{
  --cream:      #FBF3EC;
  --cream-2:    #FFFDFB;
  --blush:      #F6D8DF;
  --lavender:   #DCCFF3;
  --dusty-rose: #DE9FB3;
  --plum:       #4A3A55;
  --plum-soft:  #6E5A7E;
  --gold:       #E9C77E;
  --glass-bg:   rgba(255,255,255,0.38);
  --glass-brd:  rgba(255,255,255,0.55);
  --font-display: 'Cormorant Garamond', serif;
  --font-script:  'Caveat', cursive;
  --font-body:    'Jost', sans-serif;
}

*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; }

body{
  font-family: var(--font-body);
  color: var(--plum);
  background: linear-gradient(160deg, var(--cream) 0%, var(--blush) 45%, var(--lavender) 100%);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
}

.ambient{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob{ position:absolute; border-radius:50%; filter:blur(60px); opacity:0.55; animation: drift 18s ease-in-out infinite; }
.blob:nth-child(1){ width:320px; height:320px; background:var(--blush); top:-80px; left:-60px; animation-duration:22s; }
.blob:nth-child(2){ width:260px; height:260px; background:var(--lavender); bottom:-60px; right:-40px; animation-duration:26s; animation-delay:2s; }
.blob:nth-child(3){ width:200px; height:200px; background:var(--gold); opacity:0.25; top:40%; left:60%; animation-duration:20s; animation-delay:4s; }
@keyframes drift{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(30px,-25px) scale(1.08); } }

.stage{
  position:relative; z-index:1;
  min-height:100vh; width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:32px 20px;
}
.hidden{ display:none !important; }

.eyebrow{
  font-family:var(--font-body); letter-spacing:0.3em; text-transform:uppercase;
  font-size:12px; color:var(--dusty-rose); font-weight:500; margin-bottom:18px;
}

.glass{
  background:var(--glass-bg);
  border:1px solid var(--glass-brd);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-radius:28px;
  box-shadow: 0 8px 40px rgba(74,58,85,0.12);
}

/* ---------- opening card ---------- */
#stage-open .open-title{
  font-family:var(--font-display); font-style:italic; font-weight:500;
  font-size:clamp(26px,5vw,44px); margin-bottom:18px; color:var(--plum);
}
#stage-open .open-sub{
  font-family:var(--font-script); font-size:22px; color:var(--dusty-rose); margin-bottom:34px;
}
.open-btn{
  padding:17px 44px; border:none; cursor:pointer; border-radius:999px;
  font-family:var(--font-body); font-size:15px; letter-spacing:0.06em;
  color:var(--cream-2); background:linear-gradient(135deg,var(--dusty-rose),var(--lavender));
  box-shadow:0 10px 30px rgba(222,159,179,0.45);
  transition: transform .25s ease, box-shadow .25s ease;
}
.open-btn:hover{ transform:translateY(-3px); box-shadow:0 14px 36px rgba(222,159,179,0.55); }
.open-btn:active{ transform:translateY(0) scale(0.97); }

/* ---------- cake ---------- */
#stage-cake .cake-wrap{ position:relative; width:min(320px,80vw); margin-bottom:22px; opacity:0; transform:scale(0.85); animation: cakeIn 0.9s cubic-bezier(.2,.9,.3,1.3) forwards; }
@keyframes cakeIn{ to{ opacity:1; transform:scale(1); } }
.flame{ transform-origin:center bottom; animation: flicker 0.6s ease-in-out infinite alternate; }
.flame:nth-of-type(2){ animation-duration:0.7s; }
.flame:nth-of-type(3){ animation-duration:0.5s; }
@keyframes flicker{ 0%{ transform:scale(1,1) rotate(-2deg); opacity:1; } 100%{ transform:scale(1.08,0.95) rotate(2deg); opacity:0.85; } }
.flame.out{ animation:none; opacity:0; transition:opacity .5s ease; }
.smoke{ opacity:0; transform:translateY(0) scale(1); }
.smoke.show{ animation: smokeRise 1.6s ease-out forwards; }
@keyframes smokeRise{ 0%{ opacity:0.6; transform:translateY(0) scale(1); } 100%{ opacity:0; transform:translateY(-40px) scale(2); } }
#stage-cake .prompt{ font-family:var(--font-display); font-style:italic; font-size:clamp(22px,4vw,32px); color:var(--plum); margin-bottom:10px; min-height:1.4em; }
#stage-cake .prompt-sub{ font-size:14px; color:var(--plum-soft); margin-bottom:26px; }
.blow-count{ font-family:var(--font-display); font-size:clamp(50px,10vw,80px); font-weight:600; color:var(--dusty-rose); min-height:1.2em; }
.blow-btn{
  margin-top:18px; padding:16px 40px; border:none; cursor:pointer; border-radius:999px;
  font-family:var(--font-body); font-size:15px; letter-spacing:0.05em;
  color:var(--cream-2); background:linear-gradient(135deg,var(--dusty-rose),var(--lavender));
  box-shadow:0 10px 30px rgba(222,159,179,0.45);
  transition: transform .25s ease, box-shadow .25s ease;
}
.blow-btn:hover{ transform:translateY(-3px); box-shadow:0 14px 36px rgba(222,159,179,0.55); }
.blow-btn:active{ transform:translateY(0) scale(0.97); }

/* ---------- wish ---------- */
#stage-wish .wish-title{
  font-family:var(--font-display); font-weight:600; font-style:italic;
  font-size:clamp(38px,8vw,72px); color:var(--plum);
  display:flex; flex-wrap:wrap; justify-content:center; gap:2px;
}
#stage-wish .wish-title span{ opacity:0; transform:translateY(18px); animation: letterUp .6s ease forwards; }
@keyframes letterUp{ to{ opacity:1; transform:translateY(0);} }
#stage-wish .wish-msg{
  max-width:560px; margin:26px auto 34px; padding:28px 30px;
  font-family:var(--font-body); font-size:16px; line-height:1.8; color:var(--plum-soft);
  opacity:0; animation: fadeUp 1s ease forwards; animation-delay:1.6s;
}
@keyframes fadeUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }
.scroll-cue{
  font-family:var(--font-body); font-size:13px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--dusty-rose); border:none; background:none; cursor:pointer;
  opacity:0; animation: fadeUp 1s ease forwards; animation-delay:2.4s;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.scroll-cue .arrow{ animation:bounceDown 1.6s ease-in-out infinite; font-size:18px; }
@keyframes bounceDown{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(6px);} }

#confetti-canvas{ position:fixed; inset:0; z-index:5; pointer-events:none; }

/* ---------- gallery ---------- */
#stage-gallery{ min-height:auto; padding:90px 20px 100px; display:block; }
.gallery-head{ text-align:center; margin-bottom:50px; }
.gallery-head h2{ font-family:var(--font-display); font-style:italic; font-weight:600; font-size:clamp(32px,6vw,50px); color:var(--plum); }
.gallery-head p{ font-family:var(--font-script); font-size:22px; color:var(--dusty-rose); margin-top:6px; }

.masonry{ columns:2; column-gap:18px; max-width:1000px; margin:0 auto; }
@media(min-width:720px){ .masonry{ columns:3; column-gap:22px; } }

.m-card{
  break-inside:avoid; margin-bottom:18px; border-radius:22px; overflow:hidden;
  position:relative; opacity:0; transform:translateY(40px);
  transition:opacity .8s ease, transform .8s ease;
}
.m-card.in-view{ opacity:1; transform:translateY(0); }
.m-card:nth-child(3n+1){ transform:translateY(40px) rotate(-2deg); }
.m-card:nth-child(3n+2){ transform:translateY(40px) rotate(1.5deg); }
.m-card:nth-child(3n+1).in-view{ transform:translateY(0) rotate(-2deg); }
.m-card:nth-child(3n+2).in-view{ transform:translateY(0) rotate(1.5deg); }

.photo-card{
  background:linear-gradient(160deg,var(--blush),var(--lavender));
  aspect-ratio: var(--ar, 1/1.1);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  position:relative; overflow:hidden;
  border:1px solid rgba(255,255,255,0.6);
  box-shadow:0 12px 26px rgba(74,58,85,0.14);
}
.photo-card img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
}
.photo-card .ph-cap{
  position:relative; z-index:2; font-family:var(--font-script); font-size:19px; color:#fff;
  text-align:center; padding:10px 12px 12px; width:100%;
  background:linear-gradient(to top, rgba(74,58,85,0.55), rgba(74,58,85,0));
}

.quote-card{
  padding:26px 20px; background:var(--glass-bg); border:1px solid var(--glass-brd);
  backdrop-filter:blur(14px);
  box-shadow:0 10px 24px rgba(74,58,85,0.10);
}
.quote-card p{ font-family:var(--font-script); font-size:23px; line-height:1.35; color:var(--plum); }

.sticker{ position:absolute; font-size:22px; opacity:0.9; pointer-events:none; z-index:3; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
.sticker.tl{ top:8px; left:10px; transform:rotate(-12deg); }
.sticker.br{ bottom:8px; right:10px; transform:rotate(10deg); }

.gallery-footer{ text-align:center; margin-top:60px; font-family:var(--font-script); font-size:20px; color:var(--dusty-rose); }

#sound-toggle{
  position:fixed; top:18px; right:18px; z-index:20;
  width:44px; height:44px; border-radius:50%; border:1px solid var(--glass-brd);
  background:var(--glass-bg); backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:18px; box-shadow:0 6px 18px rgba(74,58,85,0.15);
  transition:transform .2s ease;
}
#sound-toggle:hover{ transform:scale(1.08); }
</style>
</head>
<body>

<!-- opening card -->
<section id="stage-open" class="stage">

<script>
/* ============================================================
   CONFIG — edit everything here
   ============================================================ */
const CONFIG = {
  herName: "My Love",   // TODO: her name

  message:
    "Happy birthday to the person who makes every ordinary day feel like " +
    "something worth remembering. I hope today is as soft, as bright, and " +
    "as loved as you make me feel every single day. Here's to another year " +
    "of us. I love you, endlessly.",

  // Local photos live next to this HTML file.
  photos: [
    { src: "pic-3.jpeg", caption: "a little memory",        ar: "3/4" },
    { src: "pic-2.jpeg", caption: "another little memory",  ar: "37/80" },
    { src: "pic-1.jpeg", caption: "one for the scrapbook",  ar: "9/16" },
    { src: "pic-4.jpeg", caption: "soft and sweet",         ar: "3/4" },
    { src: "pic-5.jpeg", caption: "my favorite smile",      ar: "3/4" },
    { src: "pic-6.jpeg", caption: "just us",                ar: "3/4" },
    { src: "pic-7.jpeg", caption: "forever kind of day",    ar: "9/16" }
  ],

  quotes: [
    "you're my favourite notification.",
    "still choosing you. every time.",
    "lucky to love you.",
    "you + me, forever a good idea."
  ]
};

/* ============================================================
   helpers
   ============================================================ */
const $ = (id) => document.getElementById(id);
const stages = {
  open: $('stage-open'),
  cake: $('stage-cake'),
  wish: $('stage-wish'),
  gallery: $('stage-gallery')
};
let candleCountdown = null;

/* ============================================================
   sound engine (Web Audio — no external files needed)
   ============================================================ */
let actx;
let ambientNodes = [];
let soundOn = false;

function ensureCtx(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}
function chime(freqs=[880,1108,1318], dur=1.1){
  const ctx = ensureCtx();
  freqs.forEach((f,i)=>{
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    const t0 = ctx.currentTime + i*0.09;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.06, t0+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g).connect(ctx.destination);
    o.start(t0); o.stop(t0+dur+0.1);
  });
}
function startAmbient(){
  const ctx = ensureCtx();
  const master = ctx.createGain();
  master.gain.value = 0.028;
  master.connect(ctx.destination);
  const notes = [261.6,329.6,392.0,466.2];
  notes.forEach((f,i)=>{
    const o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = f;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.08 + i*0.01;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 4;
    lfo.connect(lfoGain).connect(o.frequency);
    o.connect(master);
    o.start(); lfo.start();
    ambientNodes.push(o, lfo);
  });
}
function setSoundIcon(){ $('sound-toggle').textContent = soundOn ? '🔊' : '🔈'; }
async function enableSound(){
  try{
    ensureCtx();
    if(actx.state === 'suspended') await actx.resume();
    if(!soundOn){ startAmbient(); soundOn = true; setSoundIcon(); }
  }catch(e){ /* autoplay blocked; user can tap the icon */ }
}
$('sound-toggle').addEventListener('click', async ()=>{
  if(!soundOn){ await enableSound(); }
  else{
    ambientNodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
    ambientNodes = []; soundOn = false; setSoundIcon();
  }
});

/* ============================================================
   confetti burst
   ============================================================ */
const canvas = $('confetti-canvas');
const ctx2d = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

function burstConfetti(){
  const colors = ['#F6D8DF','#DCCFF3','#DE9FB3','#E9C77E','#FFFDFB'];
  const pieces = Array.from({length:120}, ()=>({
    x: canvas.width/2 + (Math.random()-0.5)*80,
    y: canvas.height*0.35 + (Math.random()-0.5)*60,
    vx: (Math.random()-0.5)*8,
    vy: -Math.random()*9 - 3,
    size: 5 + Math.random()*6,
    color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360,
    vr: (Math.random()-0.5)*12,
    life: 0
  }));
  function tick(){
    ctx2d.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    pieces.forEach(p=>{
      if(p.life > 140) return;
      alive = true;
      p.vy += 0.18; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      ctx2d.save();
      ctx2d.translate(p.x,p.y); ctx2d.rotate(p.rot*Math.PI/180);
      ctx2d.fillStyle = p.color;
      ctx2d.globalAlpha = Math.max(0, 1 - p.life/140);
      ctx2d.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx2d.restore();
    });
    if(alive) requestAnimationFrame(tick);
    else ctx2d.clearRect(0,0,canvas.width,canvas.height);
  }
  tick();
}

/* ============================================================
   opening -> cake
   ============================================================ */
$('open-btn').addEventListener('click', async ()=>{
  await enableSound();
  stages.open.classList.add('hidden');
  stages.cake.classList.remove('hidden');
  $('blow-count').textContent = '';
  $('cake-prompt').textContent = "Tap blow when you're ready";
  $('cake-sub').textContent = 'the countdown starts after you press it';
  $('blow-btn').classList.remove('hidden');
  chime([740,880]);
});

function startCandleCountdown(){
  if(candleCountdown) return;
  $('blow-btn').classList.add('hidden');
  $('cake-prompt').textContent = 'Make a wish, love…';
  $('cake-sub').textContent = 'and blow out the candles on the count of seven';
  let n = 7;
  $('blow-count').textContent = n;
  candleCountdown = setInterval(()=>{
    n--;
    if(n > 0){ $('blow-count').textContent = n; chime([620],0.4); }
    else{
      clearInterval(candleCountdown);
      candleCountdown = null;
      $('blow-count').textContent = '';
      document.querySelectorAll('.flame').forEach(f=>f.classList.add('out'));
      document.querySelectorAll('.smoke').forEach(s=>s.classList.add('show'));
      $('cake-prompt').textContent = 'yay! 🎉';
      $('cake-sub').textContent = '';
      chime([523,659,784,1046], 1.4);
      setTimeout(revealWish, 1400);
    }
  }, 1000);
}
$('blow-btn').addEventListener('click', startCandleCountdown);

/* ============================================================
   wish reveal
   ============================================================ */
function revealWish(){
  stages.cake.classList.add('hidden');
  stages.wish.classList.remove('hidden');

  const titleText = `Happy Birthday, ${CONFIG.herName}!`;
  const titleEl = $('wish-title');
  titleEl.innerHTML = '';
  [...titleText].forEach((ch,i)=>{
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.animationDelay = (0.15 + i*0.045) + 's';
    titleEl.appendChild(span);
  });
  $('wish-msg').textContent = CONFIG.message;

  burstConfetti();
  setTimeout(()=> chime([784,988,1174],1.6), 200);

  buildGallery();
}
$('scroll-cue').addEventListener('click', ()=>{
  stages.gallery.scrollIntoView({behavior:'smooth'});
});

/* ============================================================
   gallery
   ============================================================ */
const stickerEmojis = ['🌸','🤍','✨','🎀','🍑','💌'];
function buildGallery(){
  const wrap = $('masonry');
  if(wrap.childElementCount) return;
  const items = [];
  CONFIG.photos.forEach(p => items.push({type:'photo', data:p}));
  CONFIG.quotes.forEach(q => items.push({type:'quote', data:q}));
  items.sort(()=>Math.random()-0.5);

  items.forEach((item, idx)=>{
    const card = document.createElement('div');
    card.className = 'm-card';

    if(item.type === 'photo'){
      const inner = document.createElement('div');
      inner.className = 'photo-card glass';
      inner.style.setProperty('--ar', item.data.ar || '1/1');
      const img = document.createElement('img');
      img.src = item.data.src;
      img.alt = item.data.caption;
      img.loading = 'lazy';
      const cap = document.createElement('div');
      cap.className = 'ph-cap';
      cap.textContent = item.data.caption;
      inner.appendChild(img);
      inner.appendChild(cap);
      card.appendChild(inner);
    } else {
      const inner = document.createElement('div');
      inner.className = 'quote-card';
      inner.innerHTML = `<p>${item.data}</p>`;
      card.appendChild(inner);
    }

    if(idx % 3 === 0){
      const st1 = document.createElement('span');
      st1.className = 'sticker tl';
      st1.textContent = stickerEmojis[idx % stickerEmojis.length];
      card.appendChild(st1);
    }

    wrap.appendChild(card);
  });

  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in-view'); });
  }, { threshold:0.15 });
  document.querySelectorAll('.m-card').forEach(c=>observer.observe(c));
}
</script>
</body>
